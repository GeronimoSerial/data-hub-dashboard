[project]
name = "geo-static"
version = "1.0.0"
description = "Jobs offline (batch G1 ENOS): indice de aislamiento OSM y susceptibilidad estatica physrisk, por escuela."
requires-python = ">=3.11,<3.13"
dependencies = [
  "osmnx>=1.9,<2",
  "networkx>=3.3",
  "pandas>=2.2",
  "requests>=2.32",
  "shapely>=2.0",
  "physrisk-lib>=1.9,<2",
  "scikit-learn>=1.4",
  "pyrosm>=0.13.1",
  "fsspec>=2026.9.0",
  "s3fs>=2026.9.0",
  "aiohttp>=3.14.3",
  "rasterio>=1.4.4",
  "numpy>=2.4.6",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
