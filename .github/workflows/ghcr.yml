name: Publish GHCR image

on:
  push:
    branches:
      - prod
      - staging
      - dev

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  COOLIFY_URL: https://coolify.sistemas.mec.gob.ar

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'prod' && 'production' || github.ref_name }}
      url: ${{ github.ref_name == 'prod' && 'https://analisis.sistemas.mec.gob.ar' || format('https://{0}.analisis.sistemas.mec.gob.ar', github.ref_name) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify DEV target and database isolation before release
        if: github.ref == 'refs/heads/dev'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_DEV_APP_UUID: ${{ secrets.COOLIFY_DEV_APP_UUID }}
          DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: |
          python3 scripts/test_dev_release_guard.py
          python3 scripts/verify_dev_release.py

      - name: Verify STAGING target and data isolation before release
        if: github.ref == 'refs/heads/staging'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_STAGING_APP_UUID: ${{ secrets.COOLIFY_STAGING_APP_UUID }}
        run: |
          python3 scripts/test_staging_release_guard.py
          python3 scripts/verify_staging_release.py

      - name: Image name (GHCR requires lowercase)
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          REPO=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${OWNER}/${REPO}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Triggers a redeploy of the Coolify app that matches the pushed branch so it
      # picks up the image just pushed above: `staging` redeploys the staging app
      # (COOLIFY_STAGING_APP_UUID, image tag `staging`); `prod` redeploys
      # production (COOLIFY_APP_UUID, image tag `latest`). `main` never deploys.
      # Coolify pulls private GHCR via host `docker login ghcr.io` (PAT read:packages).
      - name: Trigger Coolify deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_PROD_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_STAGING_APP_UUID: ${{ secrets.COOLIFY_STAGING_APP_UUID }}
          COOLIFY_DEV_APP_UUID: ${{ secrets.COOLIFY_DEV_APP_UUID }}
        run: |
          # Resolved in shell on purpose: an `&& ||` expression would silently fall
          # back to production when the staging secret is empty.
          case "$GITHUB_REF" in
            refs/heads/prod) COOLIFY_APP_UUID="$COOLIFY_PROD_APP_UUID" ;;
            refs/heads/staging) COOLIFY_APP_UUID="$COOLIFY_STAGING_APP_UUID" ;;
            refs/heads/dev) COOLIFY_APP_UUID="$COOLIFY_DEV_APP_UUID" ;;
            *) echo "Unexpected ref ${GITHUB_REF}: no deploy target"; exit 1 ;;
          esac

          if [ -z "$COOLIFY_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            echo "COOLIFY_TOKEN / COOLIFY_APP_UUID not set — skipping deploy trigger"
            exit 0
          fi

          # Coolify v4 moved the deploy trigger from GET to POST with a JSON body.
          response=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg uuid "$COOLIFY_APP_UUID" '{uuid: $uuid, force: true}')" \
            "${COOLIFY_URL}/api/v1/deploy")

          deployment_uuid=$(echo "$response" | jq -r '.deployments[0].deployment_uuid // empty')
          if [ -z "$deployment_uuid" ]; then
            echo "Could not read deployment_uuid from Coolify response:"
            echo "$response"
            exit 1
          fi
          echo "Coolify deployment queued: ${deployment_uuid}"

          # Poll for completion: every 10s, up to ~10 minutes.
          max_attempts=60
          attempt=0
          status=""
          while [ "$attempt" -lt "$max_attempts" ]; do
            # A transient network error (e.g. curl exit 56, connection reset)
            # must not fail the job: count it as an attempt and poll again.
            if ! http_code=$(curl -sS -o deployment.json -w '%{http_code}' \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Accept: application/json" \
              "${COOLIFY_URL}/api/v1/deployments/${deployment_uuid}"); then
              echo "::warning::Could not reach Coolify (attempt $((attempt + 1))/${max_attempts}); retrying."
              attempt=$((attempt + 1))
              sleep 10
              continue
            fi
            if [ "$http_code" = "401" ] || [ "$http_code" = "403" ]; then
              echo "::warning::COOLIFY_TOKEN cannot read deployments (HTTP ${http_code}); not waiting for the result."
              exit 0
            fi
            status=$(jq -r '.status // empty' deployment.json 2>/dev/null)

            echo "Deployment status: ${status:-unknown} (attempt $((attempt + 1))/${max_attempts})"

            case "$status" in
              finished)
                echo "Coolify deployment finished successfully."
                exit 0
                ;;
              failed|cancelled-by-user)
                echo "Coolify deployment ended with status: ${status}"
                exit 1
                ;;
            esac

            attempt=$((attempt + 1))
            sleep 10
          done

          echo "Timed out waiting for Coolify deployment to finish (last status: ${status:-unknown})"
          exit 1
